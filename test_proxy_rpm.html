<script>
// ============================================
// PROXY MODELS - CLI Channel
// ============================================
const MODELS = {
    'gemini-2.5-flash': 'gemini-2.5-flash-真流-[星星公益站-CLI渠道]',
    'gemini-2.5-pro': 'gemini-2.5-pro-真流-[星星公益站-CLI渠道]',
    'gemini-3-flash': 'gemini-3-flash-high-真流-[星星公益站-CLI渠道]',
    'gemini-3-pro': 'gemini-3-pro-真流-[星星公益站-CLI渠道]',
    'gemini-3.1-pro': 'gemini-3.1-pro-真流-[星星公益站-CLI渠道]',
};

// Stats tracking
let stats = { total: 0, success: 0, failed: 0, times: [], results: [] };

function resetStats() {
    stats = { total: 0, success: 0, failed: 0, times: [], results: [] };
    updateSummary();
}

function updateSummary() {
    document.getElementById('summaryGrid').style.display = 'grid';
    document.getElementById('sumTotal').textContent = stats.total;
    document.getElementById('sumSuccess').textContent = stats.success;
    document.getElementById('sumFailed').textContent = stats.failed;
    const avg = stats.times.length > 0 
        ? (stats.times.reduce((a,b) => a+b, 0) / stats.times.length / 1000).toFixed(1) 
        : '0';
    document.getElementById('sumAvgTime').textContent = avg + 's';
}

function setProgress(pct, text) {
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = text || '';
}

// ============================================
// LOGGING
// ============================================
function log(message, type = 'info') {
    const logArea = document.getElementById('logArea');
    const timestamp = new Date().toLocaleTimeString('vi-VN', { hour12: false });
    const div = document.createElement('div');
    div.className = `log-line log-${type}`;
    div.innerHTML = `<span class="log-dim">[${timestamp}]</span> ${message}`;
    logArea.appendChild(div);
    logArea.scrollTop = logArea.scrollHeight;
}

function clearLog() {
    document.getElementById('logArea').innerHTML = '';
    resetStats();
    setProgress(0, '');
}

// ============================================
// API CALL
// ============================================
async function callProxy(modelId, text = 'Xin chào! Trả lời đúng 1 từ.', timeout = 30000) {
    const apiKey = document.getElementById('apiKey').value.trim();
    const baseUrl = document.getElementById('baseUrl').value.trim();
    
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    const startTime = Date.now();
    
    try {
        const response = await fetch(baseUrl, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: modelId,
                messages: [{ role: 'user', content: text }],
                temperature: 0.3,
                max_tokens: 50
            }),
            signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        const elapsed = Date.now() - startTime;
        
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            const errorMsg = errorData.error?.message || `HTTP ${response.status}`;
            return {
                ok: false,
                status: response.status,
                error: errorMsg,
                elapsed,
                model: modelId
            };
        }
        
        const data = await response.json();
        const content = data.choices?.[0]?.message?.content?.trim() || '(empty)';
        
        return {
            ok: true,
            status: 200,
            content: content.substring(0, 100),
            elapsed,
            model: data.model || modelId,
            usage: data.usage
        };
    } catch (err) {
        clearTimeout(timeoutId);
        const elapsed = Date.now() - startTime;
        return {
            ok: false,
            status: 0,
            error: err.name === 'AbortError' ? 'Timeout' : err.message,
            elapsed,
            model: modelId
        };
    }
}

// ============================================
// TEST 1: List Models
// ============================================
async function testListModels() {
    clearLog();
    log('📋 <b>Đang lấy danh sách models từ proxy...</b>', 'highlight');
    
    const apiKey = document.getElementById('apiKey').value.trim();
    const modelsUrl = document.getElementById('modelsUrl').value.trim();
    
    try {
        const response = await fetch(modelsUrl, {
            headers: { 'Authorization': `Bearer ${apiKey}` }
        });
        
        if (!response.ok) {
            log(`❌ HTTP ${response.status}`, 'error');
            return;
        }
        
        const data = await response.json();
        const models = data.data || data;
        
        log(`✅ Tìm thấy <b>${models.length}</b> models:`, 'success');
        
        // Filter Gemini models
        const geminiModels = models.filter(m => 
            m.id?.toLowerCase().includes('gemini') || 
            m.id?.toLowerCase().includes('cli')
        );
        
        log(`<br>🔷 <b>Gemini/CLI Models (${geminiModels.length}):</b>`, 'highlight');
        geminiModels.forEach(m => {
            const id = m.id || m.name || JSON.stringify(m);
            const isFlash = id.includes('flash');
            const isPro = id.includes('pro');
            const tag = isFlash ? 'flash' : (isPro ? 'pro' : '');
            log(`  <span class="model-tag ${tag}">${id}</span>`);
        });
        
        // Other models
        const otherModels = models.filter(m => 
            !m.id?.toLowerCase().includes('gemini') && 
            !m.id?.toLowerCase().includes('cli')
        );
        
        if (otherModels.length > 0) {
            log(`<br>🔶 <b>Other Models (${otherModels.length}):</b>`, 'highlight');
            otherModels.forEach(m => {
                log(`  📌 ${m.id || m.name || JSON.stringify(m)}`);
            });
        }
        
    } catch (err) {
        log(`❌ Lỗi: ${err.message}`, 'error');
    }
}

// ============================================
// TEST 2: Test Single Model
// ============================================
async function testSingleModel() {
    clearLog();
    resetStats();
    
    const modelId = MODELS['gemini-3-flash'];
    log(`🔵 <b>Test đơn model: ${modelId}</b>`, 'highlight');
    log('Gửi 1 request đơn giản...', 'info');
    
    setProgress(50, 'Đang gửi request...');
    
    const result = await callProxy(modelId);
    stats.total++;
    
    if (result.ok) {
        stats.success++;
        stats.times.push(result.elapsed);
        log(`✅ Thành công! (${result.elapsed}ms)`, 'success');
        log(`   Model: ${result.model}`, 'info');
        log(`   Response: "${result.content}"`, 'info');
        if (result.usage) {
            log(`   Tokens: prompt=${result.usage.prompt_tokens}, completion=${result.usage.completion_tokens}`, 'dim');
        }
    } else {
        stats.failed++;
        log(`❌ Thất bại: ${result.status} - ${result.error}`, 'error');
    }
    
    updateSummary();
    setProgress(100, 'Hoàn thành!');
}

// ============================================
// TEST 3: Test RPM trên 1 model (Burst requests)
// ============================================
async function testRPMSingleModel() {
    clearLog();
    resetStats();
    
    const modelId = MODELS['gemini-3-flash'];
    const burstCount = 8; // Gửi 8 requests liên tiếp
    
    log(`⚡ <b>TEST RPM BURST - 1 MODEL</b>`, 'highlight');
    log(`Model: ${modelId}`, 'info');
    log(`Gửi ${burstCount} requests liên tiếp (KHÔNG delay) để tìm giới hạn RPM...`, 'info');
    log('────────────────────────────────────', 'dim');
    
    const startTime = Date.now();
    const promises = [];
    
    // Gửi tất cả cùng lúc
    for (let i = 0; i < burstCount; i++) {
        const idx = i + 1;
        promises.push(
            callProxy(modelId, `Trả lời đúng 1 từ: ${idx} + ${idx} = ?`).then(result => {
                result._index = idx;
                return result;
            })
        );
        log(`📤 Gửi request #${idx}...`, 'dim');
    }
    
    setProgress(30, `Đang chờ ${burstCount} responses...`);
    
    const results = await Promise.allSettled(promises);
    const totalTime = Date.now() - startTime;
    
    log('────────────────────────────────────', 'dim');
    log(`📥 <b>KẾT QUẢ (${totalTime}ms tổng):</b>`, 'highlight');
    
    let successCount = 0;
    let failCount = 0;
    let rateLimitCount = 0;
    
    results.forEach((r, i) => {
        const result = r.status === 'fulfilled' ? r.value : { ok: false, error: r.reason, elapsed: 0, _index: i+1 };
        stats.total++;
        
        if (result.ok) {
            stats.success++;
            stats.times.push(result.elapsed);
            successCount++;
            log(`  ✅ #${result._index}: ${result.elapsed}ms - "${result.content}"`, 'success');
        } else {
            stats.failed++;
            failCount++;
            if (result.status === 429) {
                rateLimitCount++;
                log(`  🚫 #${result._index}: 429 RATE LIMITED (${result.elapsed}ms) - ${result.error}`, 'error');
            } else {
                log(`  ❌ #${result._index}: ${result.status} - ${result.error} (${result.elapsed}ms)`, 'error');
            }
        }
    });
    
    log('────────────────────────────────────', 'dim');
    log(`📊 <b>KẾT LUẬN TEST BURST 1 MODEL:</b>`, 'highlight');
    log(`   Thành công: ${successCount}/${burstCount}`, successCount > 0 ? 'success' : 'error');
    log(`   Rate Limited (429): ${rateLimitCount}`, rateLimitCount > 0 ? 'warning' : 'success');
    log(`   Lỗi khác: ${failCount - rateLimitCount}`, (failCount - rateLimitCount) > 0 ? 'error' : 'success');
    
    if (rateLimitCount > 0) {
        log(`   ⚠️ RPM limit đang hoạt động! Chỉ ${successCount} request được chấp nhận trong burst`, 'warning');
    } else if (successCount === burstCount) {
        log(`   ✅ Tất cả ${burstCount} requests đều OK! RPM có thể cao hơn ${burstCount}`, 'success');
    }
    
    updateSummary();
    setProgress(100, 'Hoàn thành test burst!');
}

// ============================================
// TEST 4: Test RPM Multi-Model (Câu hỏi chính!)
// ============================================
async function testRPMMultiModel() {
    clearLog();
    resetStats();
    
    const modelNames = ['gemini-3-flash', 'gemini-2.5-flash', 'gemini-2.5-pro'];
    
    log(`🔥 <b>TEST RPM MULTI-MODEL - TẤT CẢ MODEL CÙNG LÚC</b>`, 'highlight');
    log(`Mục đích: Xem RPM=5 áp dụng cho MỖI model hay CHUNG tất cả`, 'highlight');
    log('────────────────────────────────────', 'dim');
    log(`Sẽ gửi 3 requests ĐỒNG THỜI tới 3 model khác nhau:`, 'info');
    modelNames.forEach(name => {
        const isFlash = name.includes('flash');
        log(`  <span class="model-tag ${isFlash ? 'flash' : 'pro'}">${name}</span> → ${MODELS[name]}`);
    });
    log('────────────────────────────────────', 'dim');
    
    // ===== ROUND 1: 1 request mỗi model, cùng lúc =====
    log(`<br>🔄 <b>ROUND 1: 1 request × 3 models = 3 requests ĐỒNG THỜI</b>`, 'highlight');
    
    setProgress(20, 'Round 1: 3 requests đồng thời...');
    
    const round1Start = Date.now();
    const round1Promises = modelNames.map(name => 
        callProxy(MODELS[name], `Trả lời 1 từ: Đây là model gì?`).then(r => {
            r._modelName = name;
            return r;
        })
    );
    
    const round1Results = await Promise.allSettled(round1Promises);
    const round1Time = Date.now() - round1Start;
    
    let round1Success = 0;
    let round1RateLimit = 0;
    
    round1Results.forEach(r => {
        const result = r.status === 'fulfilled' ? r.value : { ok: false, error: r.reason, _modelName: '?' };
        stats.total++;
        if (result.ok) {
            stats.success++;
            stats.times.push(result.elapsed);
            round1Success++;
            log(`  ✅ ${result._modelName}: ${result.elapsed}ms - "${result.content}"`, 'success');
        } else {
            stats.failed++;
            if (result.status === 429) round1RateLimit++;
            log(`  ${result.status === 429 ? '🚫' : '❌'} ${result._modelName}: ${result.status} - ${result.error}`, 'error');
        }
    });
    
    log(`  ⏱️ Round 1 tổng: ${round1Time}ms | OK: ${round1Success}/3 | 429: ${round1RateLimit}`, 'info');
    
    // ===== ROUND 2: Đợi 3s rồi gửi thêm 2 request mỗi model =====
    log(`<br>⏳ Đợi 3 giây...`, 'warning');
    await sleep(3000);
    
    log(`<br>🔄 <b>ROUND 2: 2 requests × 3 models = 6 requests ĐỒNG THỜI</b>`, 'highlight');
    setProgress(50, 'Round 2: 6 requests đồng thời...');
    
    const round2Start = Date.now();
    const round2Promises = [];
    
    for (const name of modelNames) {
        for (let i = 1; i <= 2; i++) {
            round2Promises.push(
                callProxy(MODELS[name], `Trả lời 1 số: ${i * 10} + ${i * 5} = ?`).then(r => {
                    r._modelName = name;
                    r._reqNum = i;
                    return r;
                })
            );
        }
    }
    
    const round2Results = await Promise.allSettled(round2Promises);
    const round2Time = Date.now() - round2Start;
    
    let round2Success = 0;
    let round2RateLimit = 0;
    const modelResults = {};
    
    round2Results.forEach(r => {
        const result = r.status === 'fulfilled' ? r.value : { ok: false, error: r.reason, _modelName: '?', _reqNum: 0 };
        stats.total++;
        
        if (!modelResults[result._modelName]) modelResults[result._modelName] = { ok: 0, fail: 0, rateLimit: 0 };
        
        if (result.ok) {
            stats.success++;
            stats.times.push(result.elapsed);
            round2Success++;
            modelResults[result._modelName].ok++;
            log(`  ✅ ${result._modelName}#${result._reqNum}: ${result.elapsed}ms - "${result.content}"`, 'success');
        } else {
            stats.failed++;
            modelResults[result._modelName].fail++;
            if (result.status === 429) {
                round2RateLimit++;
                modelResults[result._modelName].rateLimit++;
            }
            log(`  ${result.status === 429 ? '🚫' : '❌'} ${result._modelName}#${result._reqNum}: ${result.status} - ${result.error}`, 'error');
        }
    });
    
    log(`  ⏱️ Round 2 tổng: ${round2Time}ms | OK: ${round2Success}/6 | 429: ${round2RateLimit}`, 'info');
    
    // ===== FINAL ANALYSIS =====
    log('<br>════════════════════════════════════', 'dim');
    log(`📊 <b>PHÂN TÍCH KẾT QUẢ:</b>`, 'highlight');
    log('════════════════════════════════════', 'dim');
    
    const totalSuccess = round1Success + round2Success;
    const totalRequests = 3 + 6;
    const totalRateLimit = round1RateLimit + round2RateLimit;
    
    log(`Tổng: ${totalSuccess}/${totalRequests} thành công | ${totalRateLimit} bị rate limit`, 'info');
    
    log(`<br>📌 Per-model breakdown:`, 'highlight');
    for (const [name, data] of Object.entries(modelResults)) {
        log(`  ${name}: OK=${data.ok} | Fail=${data.fail} | 429=${data.rateLimit}`);
    }
    
    log('', 'dim');
    
    if (totalRateLimit === 0 && totalSuccess === totalRequests) {
        log(`🎉 <b>KẾT LUẬN: RPM có vẻ áp dụng RIÊNG từng model!</b>`, 'success');
        log(`   Tất cả 9 requests (3 model × 3 lần) đều OK`, 'success');
        log(`   → Bạn có thể dùng 5 RPM × 5 models = 25 requests/phút!`, 'success');
    } else if (totalRateLimit > 0) {
        // Phân tích xem rate limit có đều nhau giữa các model không
        const perModelRateLimit = Object.values(modelResults).map(d => d.rateLimit);
        const allModelsLimited = perModelRateLimit.every(rl => rl > 0);
        
        if (allModelsLimited) {
            log(`⚠️ <b>KẾT LUẬN: RPM có vẻ áp dụng CHUNG cho tất cả model!</b>`, 'warning');
            log(`   Tất cả model đều bị rate limit khi gọi cùng lúc`, 'warning');
            log(`   → RPM = 5 chung cho tất cả, cần chia sẻ giữa các model`, 'warning');
        } else {
            log(`🤔 <b>KẾT LUẬN: Chưa rõ ràng, cần test thêm</b>`, 'warning');
            log(`   Một số model bị limit, một số không`, 'warning');
            log(`   → Có thể RPM khác nhau tùy model tier`, 'warning');
        }
    } else {
        log(`❌ <b>Nhiều lỗi không phải 429 - cần kiểm tra API key/model</b>`, 'error');
    }
    
    updateSummary();
    setProgress(100, 'Hoàn thành test multi-model!');
}

// ============================================
// TEST 5: FULL TEST - Gửi nhiều nhất có thể
// ============================================
async function testRPMAllModels() {
    clearLog();
    resetStats();
    
    const allModelNames = Object.keys(MODELS);
    
    log(`💥 <b>FULL TEST - TẤT CẢ 5 MODELS × 2 REQUESTS = 10 ĐỒNG THỜI</b>`, 'highlight');
    log(`Mục đích: Xác định chính xác RPM là per-model hay global`, 'highlight');
    log('────────────────────────────────────', 'dim');
    
    // Phase 1: Gửi 1 request/model trước
    log(`<br>📤 <b>PHASE 1: 1 request × 5 models = 5 ĐỒNG THỜI</b>`, 'highlight');
    setProgress(15, 'Phase 1: 5 requests...');
    
    const phase1Start = Date.now();
    const phase1Promises = allModelNames.map(name =>
        callProxy(MODELS[name], 'Nói "OK"').then(r => { r._modelName = name; return r; })
    );
    const phase1Results = await Promise.allSettled(phase1Promises);
    const phase1Time = Date.now() - phase1Start;
    
    let p1ok = 0, p1rl = 0;
    phase1Results.forEach(r => {
        const result = r.status === 'fulfilled' ? r.value : { ok: false, error: r.reason, _modelName: '?', status: 0 };
        stats.total++;
        if (result.ok) { stats.success++; stats.times.push(result.elapsed); p1ok++; }
        else { stats.failed++; if (result.status === 429) p1rl++; }
        const icon = result.ok ? '✅' : (result.status === 429 ? '🚫' : '❌');
        const detail = result.ok ? `${result.elapsed}ms - "${result.content}"` : `${result.status} - ${result.error}`;
        log(`  ${icon} ${result._modelName}: ${detail}`, result.ok ? 'success' : 'error');
    });
    log(`  ⏱️ Phase 1: ${phase1Time}ms | OK: ${p1ok}/5 | 429: ${p1rl}`, 'info');
    
    // Wait 2s
    log(`<br>⏳ Đợi 2 giây...`, 'warning');
    await sleep(2000);
    
    // Phase 2: Gửi 2 request/model = 10 cùng lúc
    log(`<br>📤 <b>PHASE 2: 2 requests × 5 models = 10 ĐỒNG THỜI</b>`, 'highlight');
    setProgress(45, 'Phase 2: 10 requests...');
    
    const phase2Start = Date.now();
    const phase2Promises = [];
    for (const name of allModelNames) {
        for (let i = 1; i <= 2; i++) {
            phase2Promises.push(
                callProxy(MODELS[name], `Số ${i*7} + ${i*3} = ?`).then(r => {
                    r._modelName = name;
                    r._idx = i;
                    return r;
                })
            );
        }
    }
    
    const phase2Results = await Promise.allSettled(phase2Promises);
    const phase2Time = Date.now() - phase2Start;
    
    let p2ok = 0, p2rl = 0;
    const perModel = {};
    
    phase2Results.forEach(r => {
        const result = r.status === 'fulfilled' ? r.value : { ok: false, error: r.reason, _modelName: '?', _idx: 0, status: 0 };
        stats.total++;
        if (!perModel[result._modelName]) perModel[result._modelName] = { ok: 0, fail: 0, rl: 0 };
        
        if (result.ok) {
            stats.success++; stats.times.push(result.elapsed); p2ok++;
            perModel[result._modelName].ok++;
            log(`  ✅ ${result._modelName}#${result._idx}: ${result.elapsed}ms`, 'success');
        } else {
            stats.failed++;
            perModel[result._modelName].fail++;
            if (result.status === 429) { p2rl++; perModel[result._modelName].rl++; }
            log(`  ${result.status === 429 ? '🚫' : '❌'} ${result._modelName}#${result._idx}: ${result.status} - ${result.error}`, 'error');
        }
    });
    log(`  ⏱️ Phase 2: ${phase2Time}ms | OK: ${p2ok}/10 | 429: ${p2rl}`, 'info');
    
    // Wait 5s
    log(`<br>⏳ Đợi 5 giây (chờ RPM reset)...`, 'warning');
    await sleep(5000);
    
    // Phase 3: Gửi tuần tự - 1 request mỗi model cách nhau 1s
    log(`<br>📤 <b>PHASE 3: TUẦN TỰ - 1 request mỗi model, cách 1.5s</b>`, 'highlight');
    setProgress(70, 'Phase 3: tuần tự...');
    
    let p3ok = 0, p3rl = 0;
    for (let i = 0; i < allModelNames.length; i++) {
        const name = allModelNames[i];
        setProgress(70 + (i / allModelNames.length) * 25, `Phase 3: ${name}...`);
        
        const result = await callProxy(MODELS[name], 'Nói "xin chào"');
        result._modelName = name;
        stats.total++;
        
        if (result.ok) {
            stats.success++; stats.times.push(result.elapsed); p3ok++;
            log(`  ✅ ${name}: ${result.elapsed}ms - "${result.content}"`, 'success');
        } else {
            stats.failed++;
            if (result.status === 429) p3rl++;
            log(`  ${result.status === 429 ? '🚫' : '❌'} ${name}: ${result.status} - ${result.error}`, 'error');
        }
        
        if (i < allModelNames.length - 1) await sleep(1500);
    }
    log(`  Phase 3: OK ${p3ok}/5 | 429: ${p3rl}`, 'info');
    
    // ===== FINAL VERDICT =====
    log('<br>╔═══════════════════════════════════════════╗', 'highlight');
    log('║       📊 KẾT QUẢ PHÂN TÍCH CUỐI CÙNG       ║', 'highlight');
    log('╚═══════════════════════════════════════════════╝', 'highlight');
    
    const totalRL = p1rl + p2rl + p3rl;
    const totalOK = p1ok + p2ok + p3ok;
    
    log(`<br>Tổng hợp tất cả phases:`, 'info');
    log(`  Phase 1 (5 đồng thời, 5 model): ${p1ok}/5 OK, ${p1rl} rate-limited`, p1ok === 5 ? 'success' : 'warning');
    log(`  Phase 2 (10 đồng thời, 5 model): ${p2ok}/10 OK, ${p2rl} rate-limited`, p2ok >= 8 ? 'success' : 'warning');
    log(`  Phase 3 (tuần tự, 5 model, 1.5s gap): ${p3ok}/5 OK, ${p3rl} rate-limited`, p3ok === 5 ? 'success' : 'warning');
    
    log(`<br>Per-model (Phase 2):`, 'highlight');
    for (const [name, data] of Object.entries(perModel)) {
        const icon = data.rl === 0 ? '✅' : '🚫';
        log(`  ${icon} ${name}: success=${data.ok}/2, 429=${data.rl}`, data.rl === 0 ? 'success' : 'warning');
    }
    
    log('', 'dim');
    
    if (p1rl === 0 && p2rl === 0) {
        log(`🎉 <b>KẾT LUẬN: RPM ÁP DỤNG RIÊNG TỪNG MODEL!</b>`, 'success');
        log(`   15 requests cùng lúc tới 5 model khác nhau đều OK`, 'success');
        log(`   → Bạn CÓ THỂ dùng tất cả model cùng lúc!`, 'success');
        log(`   → Throughput tối đa: 5 RPM × 5 models = 25 requests/phút`, 'success');
    } else if (p1ok === 5 && p2rl > 0 && p2rl < 8) {
        log(`🤔 <b>KẾT LUẬN: RPM CÓ VẺ GLOBAL NHƯNG LINH HOẠT</b>`, 'warning');
        log(`   5 requests đầu OK, nhưng burst 10 bị limit một phần`, 'warning');
        log(`   → RPM=5 có thể là GLOBAL (chia sẻ giữa tất cả model)`, 'warning');
        log(`   → Khuyến nghị: Gọi tuần tự, delay 12s giữa mỗi request`, 'warning');
    } else if (totalRL > 10) {
        log(`⚠️ <b>KẾT LUẬN: RPM GLOBAL VÀ NGHIÊM NGẶT!</b>`, 'error');
        log(`   Hầu hết requests bị 429 → RPM=5 là limit CHUNG`, 'error');
        log(`   → Chỉ nên dùng 1 model tại 1 thời điểm`, 'error');
        log(`   → Delay tối thiểu 12s giữa mỗi request`, 'error');
    } else {
        log(`❓ <b>Kết quả không rõ ràng - nhiều lỗi không phải 429</b>`, 'warning');
        log(`   Có thể API key hoặc model không khả dụng`, 'warning');
        log(`   OK: ${totalOK}, Failed: ${stats.failed}, 429: ${totalRL}`, 'info');
    }
    
    log(`<br>💡 <b>GỢI Ý CHO DỊCH TRUYỆN:</b>`, 'highlight');
    if (totalRL === 0) {
        log(`  ✅ Dùng multi-model rotation để tăng tốc gấp ${allModelNames.length}x!`, 'success');
        log(`  ✅ Mỗi model 5 RPM → delay 12s/model, nhưng xoay vòng 5 model → delay ~2.4s`, 'success');
    } else {
        log(`  ⚠️ Dùng 1 model ổn định nhất (gemini-3-flash có 2000 quota/ngày)`, 'warning');
        log(`  ⚠️ Delay tối thiểu 12s giữa mỗi request`, 'warning');
        log(`  💡 Hoặc: Dùng nhiều API key (multi-key) để tăng throughput`, 'info');
    }
    
    updateSummary();
    setProgress(100, '✅ Hoàn thành Full Test!');
}

// ============================================
// UTILITIES
// ============================================
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}
</script>
